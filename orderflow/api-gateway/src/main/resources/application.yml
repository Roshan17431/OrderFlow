spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-platform
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/platform/**
            - id: auth-api
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**
            - id: security-api
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/security/**
            - id: product-api
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products,/api/products/**,/api/categories,/api/categories/**,/api/vendor/products,/api/vendor/products/**,/api/admin/categories,/api/admin/categories/**,/api/admin/products,/api/admin/products/**
            - id: cart-api
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/cart,/api/cart/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowedHeaders: '*'
                allowCredentials: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s

server:
  port: 8080
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        '[@timestamp]': timestamp
        logger_name: logger
        thread_name: thread
      add:
        service: ${spring.application.name}

app:
  security:
    issuer: ${APP_JWT_ISSUER:https://orderflow.local}
    jwk-set-uri: ${APP_AUTH_JWK_SET_URI:http://localhost:8081/api/auth/.well-known/jwks.json}
