spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:orderflow_auth}
    username: ${POSTGRES_USER:orderflow}
    password: ${POSTGRES_PASSWORD:orderflow_local_password}
    hikari:
      initialization-fail-timeout: 60000
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    properties:
      request.timeout.ms: 3000
      default.api.timeout.ms: 3000
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8081
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        '[@timestamp]': timestamp
        logger_name: logger
        thread_name: thread
      add:
        service: ${spring.application.name}

app:
  security:
    jwt:
      issuer: ${APP_JWT_ISSUER:https://orderflow.local}
      key-id: ${APP_JWT_KEY_ID:orderflow-local}
      access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:10m}
      allow-ephemeral-keys: ${APP_JWT_ALLOW_EPHEMERAL_KEYS:false}
      private-key-location: ${APP_JWT_PRIVATE_KEY_LOCATION:}
      public-key-location: ${APP_JWT_PUBLIC_KEY_LOCATION:}
      minimum-key-size: 2048
    refresh:
      token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:14d}
      token-bytes: 32
      oauth-exchange-ttl: 60s
    cookies:
      refresh-cookie-name: ${APP_AUTH_REFRESH_COOKIE_NAME:ORDERFLOW_REFRESH}
      secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
      same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
      path: /api/auth
    login-attempts:
      max-attempts: ${APP_AUTH_LOGIN_MAX_ATTEMPTS:5}
      window: ${APP_AUTH_LOGIN_ATTEMPT_WINDOW:15m}
    oauth2:
      success-redirect-uri: ${APP_OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:5173/oauth2/success}
      failure-redirect-uri: ${APP_OAUTH2_FAILURE_REDIRECT_URI:http://localhost:5173/oauth2/failure}
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
