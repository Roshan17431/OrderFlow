groups:
  - name: orderflow-cloud
    rules:
      - alert: OrderFlowServiceUnavailable
        expr: up{job="orderflow"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Private application scrape is unavailable'}
      - alert: OrderFlowFrontendOrProxyUnavailable
        expr: probe_success{job="private-availability"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Frontend, proxy or gateway health probe failed'}
      - alert: OrderFlowHostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Host available memory below 10 percent'}
      - alert: OrderFlowPersistentDiskLow
        expr: node_filesystem_avail_bytes{fstype="ext4",mountpoint="/opt/orderflow"} / node_filesystem_size_bytes{fstype="ext4",mountpoint="/opt/orderflow"} < 0.15
        for: 5m
        labels: {severity: critical}
        annotations: {summary: 'Persistent EBS free disk below 15 percent'}
      - alert: OrderFlowBackupStale
        expr: time() - orderflow_backup_last_success_timestamp_seconds > 93600 or absent(orderflow_backup_last_success_timestamp_seconds)
        for: 15m
        labels: {severity: critical}
        annotations: {summary: 'Daily backup missing or older than 26 hours'}
      - alert: OrderFlowRestoreExerciseStale
        expr: time() - orderflow_backup_restore_verified_timestamp_seconds > 2678400 or absent(orderflow_backup_restore_verified_timestamp_seconds)
        for: 15m
        labels: {severity: warning}
        annotations: {summary: 'Verified restore missing or older than 31 days'}
      - alert: OrderFlowHttpServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Application HTTP 5xx exceeds five percent'}
