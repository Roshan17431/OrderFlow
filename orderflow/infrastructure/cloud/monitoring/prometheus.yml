global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/orderflow-alerts.yml
  - /etc/prometheus/cloud-alerts.yml
scrape_configs:
  - job_name: orderflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - service-registry:8761
          - api-gateway:8080
          - auth-service:8081
          - product-service:8082
          - cart-service:8083
          - inventory-service:8084
          - order-service:8085
          - payment-service:8086
          - delivery-service:8087
          - notification-service:8088
          - operations-service:8089

  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: private-availability
    metrics_path: /probe
    params:
      module: [http_private]
    static_configs:
      - targets: [http://frontend:3000/, http://caddy:8080/healthz, http://api-gateway:8080/actuator/health/readiness]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'blackbox-exporter:9115'}
