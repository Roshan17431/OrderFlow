name: orderflow

x-java-environment: &java-environment
  JAVA_TOOL_OPTIONS: ${ORDERFLOW_JAVA_TOOL_OPTIONS:--Xms32m -Xmx128m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderflow_auth}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms128m -Xmx192m}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  database-bootstrap:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-orderflow_auth}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_local_password}
      PRODUCT_POSTGRES_DB: ${PRODUCT_POSTGRES_DB:-orderflow_product}
      PRODUCT_POSTGRES_USER: ${PRODUCT_POSTGRES_USER:-orderflow_product}
      PRODUCT_POSTGRES_PASSWORD: ${PRODUCT_POSTGRES_PASSWORD:-orderflow_product_local_password}
      INVENTORY_POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-orderflow_inventory}
      INVENTORY_POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-orderflow_inventory}
      INVENTORY_POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:-orderflow_inventory_local_password}
      ORDER_POSTGRES_DB: ${ORDER_POSTGRES_DB:-orderflow_order}
      ORDER_POSTGRES_USER: ${ORDER_POSTGRES_USER:-orderflow_order}
      ORDER_POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:-orderflow_order_local_password}
      PAYMENT_POSTGRES_DB: ${PAYMENT_POSTGRES_DB:-orderflow_payment}
      PAYMENT_POSTGRES_USER: ${PAYMENT_POSTGRES_USER:-orderflow_payment}
      PAYMENT_POSTGRES_PASSWORD: ${PAYMENT_POSTGRES_PASSWORD:-orderflow_payment_local_password}
      DELIVERY_POSTGRES_DB: ${DELIVERY_POSTGRES_DB:-orderflow_delivery}
      DELIVERY_POSTGRES_USER: ${DELIVERY_POSTGRES_USER:-orderflow_delivery}
      DELIVERY_POSTGRES_PASSWORD: ${DELIVERY_POSTGRES_PASSWORD:-orderflow_delivery_local_password}
      NOTIFICATION_POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-orderflow_notification}
      NOTIFICATION_POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-orderflow_notification}
      NOTIFICATION_POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:-orderflow_notification_local_password}
      OPERATIONS_POSTGRES_DB: ${OPERATIONS_POSTGRES_DB:-orderflow_operations}
      OPERATIONS_POSTGRES_USER: ${OPERATIONS_POSTGRES_USER:-orderflow_operations}
      OPERATIONS_POSTGRES_PASSWORD: ${OPERATIONS_POSTGRES_PASSWORD:-orderflow_operations_local_password}
    volumes:
      - ./scripts/bootstrap-product-database.sh:/opt/orderflow/bootstrap-product-database.sh:ro
    entrypoint:
      - /bin/sh
      - /opt/orderflow/bootstrap-product-database.sh
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8761/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-orderflow_auth}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_JWT_KEY_ID: ${APP_JWT_KEY_ID:-orderflow-docker-local}
      APP_JWT_ALLOW_EPHEMERAL_KEYS: "true"
      APP_AUTH_REFRESH_TOKEN_TTL: ${APP_AUTH_REFRESH_TOKEN_TTL:-14d}
      APP_AUTH_REFRESH_COOKIE_NAME: ${APP_AUTH_REFRESH_COOKIE_NAME:-ORDERFLOW_REFRESH}
      APP_AUTH_REFRESH_COOKIE_SECURE: ${APP_AUTH_REFRESH_COOKIE_SECURE:-false}
      APP_AUTH_REFRESH_COOKIE_SAME_SITE: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:-Strict}
      APP_AUTH_LOGIN_MAX_ATTEMPTS: ${APP_AUTH_LOGIN_MAX_ATTEMPTS:-5}
      APP_AUTH_LOGIN_ATTEMPT_WINDOW: ${APP_AUTH_LOGIN_ATTEMPT_WINDOW:-15m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8081/actuator/health/readiness
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      PRODUCT_POSTGRES_HOST: postgres
      PRODUCT_POSTGRES_PORT: 5432
      PRODUCT_POSTGRES_DB: ${PRODUCT_POSTGRES_DB:-orderflow_product}
      PRODUCT_POSTGRES_USER: ${PRODUCT_POSTGRES_USER:-orderflow_product}
      PRODUCT_POSTGRES_PASSWORD: ${PRODUCT_POSTGRES_PASSWORD:-orderflow_product_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      APP_CATALOG_DEFAULT_CURRENCY: ${APP_CATALOG_DEFAULT_CURRENCY:-USD}
      APP_CATALOG_SUPPORTED_CURRENCIES: ${APP_CATALOG_SUPPORTED_CURRENCIES:-USD,EUR,GBP,INR}
      APP_CATALOG_MAX_PAGE_SIZE: ${APP_CATALOG_MAX_PAGE_SIZE:-100}
      APP_CATALOG_PRODUCT_CACHE_TTL: ${APP_CATALOG_PRODUCT_CACHE_TTL:-5m}
      APP_CATALOG_SEARCH_CACHE_TTL: ${APP_CATALOG_SEARCH_CACHE_TTL:-2m}
      APP_CATALOG_CATEGORY_CACHE_TTL: ${APP_CATALOG_CATEGORY_CACHE_TTL:-10m}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "${PRODUCT_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8082/actuator/health/readiness
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      APP_PRODUCT_CLIENT_BASE_URL: http://PRODUCT-SERVICE
      APP_PRODUCT_CLIENT_CONNECT_TIMEOUT: ${APP_PRODUCT_CLIENT_CONNECT_TIMEOUT:-2s}
      APP_PRODUCT_CLIENT_READ_TIMEOUT: ${APP_PRODUCT_CLIENT_READ_TIMEOUT:-3s}
      APP_CART_TTL: ${APP_CART_TTL:-30d}
      APP_CART_MAX_DISTINCT_ITEMS: ${APP_CART_MAX_DISTINCT_ITEMS:-100}
      APP_CART_MAX_QUANTITY_PER_ITEM: ${APP_CART_MAX_QUANTITY_PER_ITEM:-99}
    depends_on:
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    ports:
      - "${CART_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8083/actuator/health/readiness
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      INVENTORY_POSTGRES_HOST: postgres
      INVENTORY_POSTGRES_PORT: 5432
      INVENTORY_POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-orderflow_inventory}
      INVENTORY_POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-orderflow_inventory}
      INVENTORY_POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:-orderflow_inventory_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      APP_PRODUCT_CLIENT_BASE_URL: http://PRODUCT-SERVICE
      APP_PRODUCT_CLIENT_CONNECT_TIMEOUT: ${APP_PRODUCT_CLIENT_CONNECT_TIMEOUT:-2s}
      APP_PRODUCT_CLIENT_READ_TIMEOUT: ${APP_PRODUCT_CLIENT_READ_TIMEOUT:-3s}
      APP_ORDER_EVENTS_TOPIC: ${APP_ORDER_EVENTS_TOPIC:-orderflow.order-events.v1}
      APP_INVENTORY_EVENTS_TOPIC: ${APP_INVENTORY_EVENTS_TOPIC:-orderflow.inventory-events.v1}
      APP_PAYMENT_EVENTS_TOPIC: ${APP_PAYMENT_EVENTS_TOPIC:-orderflow.payment-events.v1}
      APP_DELIVERY_EVENTS_TOPIC: ${APP_DELIVERY_EVENTS_TOPIC:-orderflow.delivery-events.v1}
      APP_ORDER_EVENTS_DLT: ${APP_ORDER_EVENTS_DLT:-orderflow.order-events.v1.DLT}
      APP_INVENTORY_EVENTS_DLT: ${APP_INVENTORY_EVENTS_DLT:-orderflow.inventory-events.v1.DLT}
      APP_PAYMENT_EVENTS_DLT: ${APP_PAYMENT_EVENTS_DLT:-orderflow.payment-events.v1.DLT}
      APP_DELIVERY_EVENTS_DLT: ${APP_DELIVERY_EVENTS_DLT:-orderflow.delivery-events.v1.DLT}
      APP_INVENTORY_RESERVATION_TTL: ${APP_INVENTORY_RESERVATION_TTL:-15m}
      APP_INVENTORY_EXPIRATION_POLL_DELAY: ${APP_INVENTORY_EXPIRATION_POLL_DELAY:-30s}
      APP_INVENTORY_EXPIRATION_BATCH_SIZE: ${APP_INVENTORY_EXPIRATION_BATCH_SIZE:-50}
      APP_OUTBOX_POLL_DELAY: ${APP_OUTBOX_POLL_DELAY:-500ms}
      APP_OUTBOX_BATCH_SIZE: ${APP_OUTBOX_BATCH_SIZE:-50}
      APP_OUTBOX_MAX_ATTEMPTS: ${APP_OUTBOX_MAX_ATTEMPTS:-10}
      APP_OUTBOX_LOCK_TIMEOUT: ${APP_OUTBOX_LOCK_TIMEOUT:-2m}
      APP_OUTBOX_RETRY_BASE_DELAY: ${APP_OUTBOX_RETRY_BASE_DELAY:-2s}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    ports:
      - "${INVENTORY_SERVICE_PORT:-8084}:8084"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8084/actuator/health/readiness
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      ORDER_POSTGRES_HOST: postgres
      ORDER_POSTGRES_PORT: 5432
      ORDER_POSTGRES_DB: ${ORDER_POSTGRES_DB:-orderflow_order}
      ORDER_POSTGRES_USER: ${ORDER_POSTGRES_USER:-orderflow_order}
      ORDER_POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:-orderflow_order_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      APP_CART_CLIENT_BASE_URL: http://CART-SERVICE
      APP_CART_CLIENT_CONNECT_TIMEOUT: ${APP_CART_CLIENT_CONNECT_TIMEOUT:-2s}
      APP_CART_CLIENT_READ_TIMEOUT: ${APP_CART_CLIENT_READ_TIMEOUT:-3s}
      APP_ORDER_EVENTS_TOPIC: ${APP_ORDER_EVENTS_TOPIC:-orderflow.order-events.v1}
      APP_INVENTORY_EVENTS_TOPIC: ${APP_INVENTORY_EVENTS_TOPIC:-orderflow.inventory-events.v1}
      APP_PAYMENT_EVENTS_TOPIC: ${APP_PAYMENT_EVENTS_TOPIC:-orderflow.payment-events.v1}
      APP_DELIVERY_EVENTS_TOPIC: ${APP_DELIVERY_EVENTS_TOPIC:-orderflow.delivery-events.v1}
      APP_ORDER_EVENTS_DLT: ${APP_ORDER_EVENTS_DLT:-orderflow.order-events.v1.DLT}
      APP_INVENTORY_EVENTS_DLT: ${APP_INVENTORY_EVENTS_DLT:-orderflow.inventory-events.v1.DLT}
      APP_PAYMENT_EVENTS_DLT: ${APP_PAYMENT_EVENTS_DLT:-orderflow.payment-events.v1.DLT}
      APP_DELIVERY_EVENTS_DLT: ${APP_DELIVERY_EVENTS_DLT:-orderflow.delivery-events.v1.DLT}
      APP_OUTBOX_POLL_DELAY: ${APP_OUTBOX_POLL_DELAY:-500ms}
      APP_OUTBOX_BATCH_SIZE: ${APP_OUTBOX_BATCH_SIZE:-50}
      APP_OUTBOX_MAX_ATTEMPTS: ${APP_OUTBOX_MAX_ATTEMPTS:-10}
      APP_OUTBOX_LOCK_TIMEOUT: ${APP_OUTBOX_LOCK_TIMEOUT:-2m}
      APP_OUTBOX_RETRY_BASE_DELAY: ${APP_OUTBOX_RETRY_BASE_DELAY:-2s}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
    ports:
      - "${ORDER_SERVICE_PORT:-8085}:8085"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8085/actuator/health/readiness
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      PAYMENT_POSTGRES_HOST: postgres
      PAYMENT_POSTGRES_PORT: 5432
      PAYMENT_POSTGRES_DB: ${PAYMENT_POSTGRES_DB:-orderflow_payment}
      PAYMENT_POSTGRES_USER: ${PAYMENT_POSTGRES_USER:-orderflow_payment}
      PAYMENT_POSTGRES_PASSWORD: ${PAYMENT_POSTGRES_PASSWORD:-orderflow_payment_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      APP_PAYMENT_PROVIDER: simulator
      APP_PAYMENT_SIMULATOR_ENABLED: "true"
      # Deliberately local-only simulator secret; never use this value outside local Docker.
      APP_PAYMENT_SIMULATOR_WEBHOOK_SECRET: ${APP_PAYMENT_SIMULATOR_WEBHOOK_SECRET:-orderflow-local-simulator-secret-not-for-production}
      APP_PAYMENT_WEBHOOK_TOLERANCE: ${APP_PAYMENT_WEBHOOK_TOLERANCE:-5m}
      APP_PAYMENT_PROVIDER_CONNECT_TIMEOUT: ${APP_PAYMENT_PROVIDER_CONNECT_TIMEOUT:-2s}
      APP_PAYMENT_PROVIDER_READ_TIMEOUT: ${APP_PAYMENT_PROVIDER_READ_TIMEOUT:-5s}
      APP_PAYMENT_PROVIDER_RETRY_ATTEMPTS: ${APP_PAYMENT_PROVIDER_RETRY_ATTEMPTS:-2}
      APP_PAYMENT_PROVIDER_RETRY_WAIT: ${APP_PAYMENT_PROVIDER_RETRY_WAIT:-250ms}
      APP_ORDER_EVENTS_TOPIC: ${APP_ORDER_EVENTS_TOPIC:-orderflow.order-events.v1}
      APP_PAYMENT_EVENTS_TOPIC: ${APP_PAYMENT_EVENTS_TOPIC:-orderflow.payment-events.v1}
      APP_ORDER_EVENTS_DLT: ${APP_ORDER_EVENTS_DLT:-orderflow.order-events.v1.DLT}
      APP_PAYMENT_EVENTS_DLT: ${APP_PAYMENT_EVENTS_DLT:-orderflow.payment-events.v1.DLT}
      APP_OUTBOX_POLL_DELAY: ${APP_OUTBOX_POLL_DELAY:-500ms}
      APP_OUTBOX_BATCH_SIZE: ${APP_OUTBOX_BATCH_SIZE:-50}
      APP_OUTBOX_MAX_ATTEMPTS: ${APP_OUTBOX_MAX_ATTEMPTS:-10}
      APP_OUTBOX_LOCK_TIMEOUT: ${APP_OUTBOX_LOCK_TIMEOUT:-2m}
      APP_OUTBOX_RETRY_BASE_DELAY: ${APP_OUTBOX_RETRY_BASE_DELAY:-2s}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "${PAYMENT_SERVICE_PORT:-8086}:8086"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8086/actuator/health/readiness
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  delivery-service:
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      DELIVERY_POSTGRES_HOST: postgres
      DELIVERY_POSTGRES_PORT: 5432
      DELIVERY_POSTGRES_DB: ${DELIVERY_POSTGRES_DB:-orderflow_delivery}
      DELIVERY_POSTGRES_USER: ${DELIVERY_POSTGRES_USER:-orderflow_delivery}
      DELIVERY_POSTGRES_PASSWORD: ${DELIVERY_POSTGRES_PASSWORD:-orderflow_delivery_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      APP_DELIVERY_EVENTS_TOPIC: ${APP_DELIVERY_EVENTS_TOPIC:-orderflow.delivery-events.v1}
      APP_DELIVERY_EVENTS_DLT: ${APP_DELIVERY_EVENTS_DLT:-orderflow.delivery-events.v1.DLT}
      APP_DELIVERY_ASSIGNMENT_STRATEGY: ${APP_DELIVERY_ASSIGNMENT_STRATEGY:-LEAST_RECENTLY_ASSIGNED}
      APP_DELIVERY_MAX_PAGE_SIZE: ${APP_DELIVERY_MAX_PAGE_SIZE:-100}
      APP_OUTBOX_POLL_DELAY: ${APP_OUTBOX_POLL_DELAY:-500ms}
      APP_OUTBOX_BATCH_SIZE: ${APP_OUTBOX_BATCH_SIZE:-50}
      APP_OUTBOX_MAX_ATTEMPTS: ${APP_OUTBOX_MAX_ATTEMPTS:-10}
      APP_OUTBOX_LOCK_TIMEOUT: ${APP_OUTBOX_LOCK_TIMEOUT:-2m}
      APP_OUTBOX_RETRY_BASE_DELAY: ${APP_OUTBOX_RETRY_BASE_DELAY:-2s}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "${DELIVERY_SERVICE_PORT:-8087}:8087"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8087/actuator/health/readiness]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      NOTIFICATION_POSTGRES_HOST: postgres
      NOTIFICATION_POSTGRES_PORT: 5432
      NOTIFICATION_POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-orderflow_notification}
      NOTIFICATION_POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-orderflow_notification}
      NOTIFICATION_POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:-orderflow_notification_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      APP_ORDER_EVENTS_TOPIC: ${APP_ORDER_EVENTS_TOPIC:-orderflow.order-events.v1}
      APP_PAYMENT_EVENTS_TOPIC: ${APP_PAYMENT_EVENTS_TOPIC:-orderflow.payment-events.v1}
      APP_DELIVERY_EVENTS_TOPIC: ${APP_DELIVERY_EVENTS_TOPIC:-orderflow.delivery-events.v1}
      APP_NOTIFICATION_EVENTS_TOPIC: ${APP_NOTIFICATION_EVENTS_TOPIC:-orderflow.notification-events.v1}
      APP_NOTIFICATION_EVENTS_DLT: ${APP_NOTIFICATION_EVENTS_DLT:-orderflow.notification-events.v1.DLT}
      APP_NOTIFICATION_EMAIL_PROVIDER: simulator
      APP_NOTIFICATION_SMS_PROVIDER: simulator
      APP_NOTIFICATION_ASYNC_CORE_POOL_SIZE: ${APP_NOTIFICATION_ASYNC_CORE_POOL_SIZE:-2}
      APP_NOTIFICATION_ASYNC_MAX_POOL_SIZE: ${APP_NOTIFICATION_ASYNC_MAX_POOL_SIZE:-8}
      APP_NOTIFICATION_ASYNC_QUEUE_CAPACITY: ${APP_NOTIFICATION_ASYNC_QUEUE_CAPACITY:-200}
      APP_NOTIFICATION_SSE_TIMEOUT: ${APP_NOTIFICATION_SSE_TIMEOUT:-30m}
      APP_OUTBOX_POLL_DELAY: ${APP_OUTBOX_POLL_DELAY:-500ms}
      APP_OUTBOX_BATCH_SIZE: ${APP_OUTBOX_BATCH_SIZE:-50}
      APP_OUTBOX_MAX_ATTEMPTS: ${APP_OUTBOX_MAX_ATTEMPTS:-10}
      APP_OUTBOX_LOCK_TIMEOUT: ${APP_OUTBOX_LOCK_TIMEOUT:-2m}
      APP_OUTBOX_RETRY_BASE_DELAY: ${APP_OUTBOX_RETRY_BASE_DELAY:-2s}
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8088}:8088"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8088/actuator/health/readiness]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      operations-service:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  operations-service:
    build:
      context: .
      dockerfile: operations-service/Dockerfile
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: docker
      OPERATIONS_POSTGRES_HOST: postgres
      OPERATIONS_POSTGRES_PORT: 5432
      OPERATIONS_POSTGRES_DB: ${OPERATIONS_POSTGRES_DB:-orderflow_operations}
      OPERATIONS_POSTGRES_USER: ${OPERATIONS_POSTGRES_USER:-orderflow_operations}
      OPERATIONS_POSTGRES_PASSWORD: ${OPERATIONS_POSTGRES_PASSWORD:-orderflow_operations_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-https://orderflow.local}
      APP_AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
    depends_on:
      database-bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      service-registry: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    ports:
      - "${OPERATIONS_SERVICE_PORT:-8089}:8089"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8089/actuator/health/readiness]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-orderflow-local-only}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
