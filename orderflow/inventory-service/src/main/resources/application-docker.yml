eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://service-registry:8761/eureka/}

app:
  clients:
    product:
      base-url: http://PRODUCT-SERVICE
  security:
    jwt:
      jwk-set-uri: ${APP_AUTH_JWK_SET_URI:http://auth-service:8081/api/auth/.well-known/jwks.json}
