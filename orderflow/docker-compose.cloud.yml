      APP_NOTIFICATION_SMS_PROVIDER: "simulator"
      APP_NOTIFICATION_SSE_TIMEOUT: "${APP_NOTIFICATION_SSE_TIMEOUT:-30m}"
      APP_ORDER_EVENTS_TOPIC: "${APP_ORDER_EVENTS_TOPIC:-orderflow.order-events.v1}"
      APP_OUTBOX_BATCH_SIZE: "${APP_OUTBOX_BATCH_SIZE:-50}"
      APP_OUTBOX_LOCK_TIMEOUT: "${APP_OUTBOX_LOCK_TIMEOUT:-2m}"
      APP_OUTBOX_MAX_ATTEMPTS: "${APP_OUTBOX_MAX_ATTEMPTS:-10}"
      APP_OUTBOX_POLL_DELAY: "${APP_OUTBOX_POLL_DELAY:-500ms}"
      APP_OUTBOX_RETRY_BASE_DELAY: "${APP_OUTBOX_RETRY_BASE_DELAY:-2s}"
      APP_PAYMENT_EVENTS_TOPIC: "${APP_PAYMENT_EVENTS_TOPIC:-orderflow.payment-events.v1}"
      EUREKA_DEFAULT_ZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=15.0 -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      NOTIFICATION_POSTGRES_DB: "${NOTIFICATION_POSTGRES_DB:?NOTIFICATION_POSTGRES_DB must be supplied in protected runtime.env}"
      NOTIFICATION_POSTGRES_HOST: "postgres"
      NOTIFICATION_POSTGRES_PASSWORD: "${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      NOTIFICATION_POSTGRES_PORT: 5432
      NOTIFICATION_POSTGRES_USER: "${NOTIFICATION_POSTGRES_USER:?NOTIFICATION_POSTGRES_USER must be supplied in protected runtime.env}"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied in protected runtime.env}"
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: "docker,cloud-demo"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  operations-service:
    <<: *cloud
    build: !reset null
    image: "${IMAGE_OPERATIONS_SERVICE:?IMAGE_OPERATIONS_SERVICE must be supplied in protected runtime.env}"
    ports: !reset []
    profiles: !override []
    mem_limit: 640m
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment: !override
      APP_AUTH_JWK_SET_URI: "http://auth-service:8081/api/auth/.well-known/jwks.json"
      APP_JWT_ISSUER: "https://${DOMAIN_NAME:?DOMAIN_NAME is required}"
      EUREKA_DEFAULT_ZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=15.0 -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      OPERATIONS_POSTGRES_DB: "${OPERATIONS_POSTGRES_DB:?OPERATIONS_POSTGRES_DB must be supplied in protected runtime.env}"
      OPERATIONS_POSTGRES_HOST: "postgres"
      OPERATIONS_POSTGRES_PASSWORD: "${OPERATIONS_POSTGRES_PASSWORD:?OPERATIONS_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      OPERATIONS_POSTGRES_PORT: 5432
      OPERATIONS_POSTGRES_USER: "${OPERATIONS_POSTGRES_USER:?OPERATIONS_POSTGRES_USER must be supplied in protected runtime.env}"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied in protected runtime.env}"
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: "docker,cloud-demo"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  frontend:
    <<: *cloud
    build: !reset null
    image: "${IMAGE_FRONTEND:?IMAGE_FRONTEND must be supplied in protected runtime.env}"
    ports: !reset []
    profiles: !override []
    mem_limit: 512m
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777", "/app/.next/cache:size=64m,mode=1777"]
    environment: !override
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: "production"
      ORDERFLOW_INTERNAL_GATEWAY_URL: "http://api-gateway:8080"
      NODE_OPTIONS: "--max-old-space-size=384"
  postgres:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    <<: *cloud
    ports: !reset []
    mem_limit: 1g
    environment: !override
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be supplied in protected runtime.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
  redis:
    image: redis:7.4.12-alpine@sha256:338fbfc036dc5517ac0b04d6de21521085935336e565f223406180e9d84166e2
    <<: *cloud
    ports: !reset []
    mem_limit: 384m
    command: !override ["/bin/sh", "-ec", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy noeviction"]
    healthcheck: {test: [CMD-SHELL, "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"], interval: 10s, timeout: 5s, retries: 20}
    environment: !override
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied in protected runtime.env}"
  kafka:
    image: "${INFRA_IMAGE_KAFKA:?approved release infrastructure Kafka registry digest required}"
    command: !override [/bin/bash, /opt/orderflow/kafka-safe-bootstrap.sh]
    volumes: [{type: bind, source: ./infrastructure/kafka/safe-bootstrap.sh, target: /opt/orderflow/kafka-safe-bootstrap.sh, read_only: true, bind: {create_host_path: false}}]
    <<: *cloud
    ports: !reset []
    mem_limit: 1g
    environment: !override
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be supplied in protected runtime.env}"
      ORDERFLOW_KAFKA_INITIALIZE_EMPTY: "${KAFKA_INITIALIZE_EMPTY:-false}"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LISTENERS: "CONTROLLER://:29093,INTERNAL://:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_RETENTION_BYTES: "1073741824"
  database-bootstrap:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    <<: *cloud
    restart: "no"
    volumes: !override [{type: bind, source: ./infrastructure/bootstrap/bootstrap-databases.sh, target: /opt/orderflow/bootstrap-databases.sh, read_only: true}]
    entrypoint: !override [/bin/sh, /opt/orderflow/bootstrap-databases.sh]
    environment: !override
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be supplied in protected runtime.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      AUTH_POSTGRES_DB: "${AUTH_POSTGRES_DB:?AUTH_POSTGRES_DB must be supplied in protected runtime.env}"
      AUTH_POSTGRES_USER: "${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER must be supplied in protected runtime.env}"
      AUTH_POSTGRES_PASSWORD: "${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      PRODUCT_POSTGRES_DB: "${PRODUCT_POSTGRES_DB:?PRODUCT_POSTGRES_DB must be supplied in protected runtime.env}"
      PRODUCT_POSTGRES_USER: "${PRODUCT_POSTGRES_USER:?PRODUCT_POSTGRES_USER must be supplied in protected runtime.env}"
      PRODUCT_POSTGRES_PASSWORD: "${PRODUCT_POSTGRES_PASSWORD:?PRODUCT_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      INVENTORY_POSTGRES_DB: "${INVENTORY_POSTGRES_DB:?INVENTORY_POSTGRES_DB must be supplied in protected runtime.env}"
      INVENTORY_POSTGRES_USER: "${INVENTORY_POSTGRES_USER:?INVENTORY_POSTGRES_USER must be supplied in protected runtime.env}"
      INVENTORY_POSTGRES_PASSWORD: "${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      ORDER_POSTGRES_DB: "${ORDER_POSTGRES_DB:?ORDER_POSTGRES_DB must be supplied in protected runtime.env}"
      ORDER_POSTGRES_USER: "${ORDER_POSTGRES_USER:?ORDER_POSTGRES_USER must be supplied in protected runtime.env}"
      ORDER_POSTGRES_PASSWORD: "${ORDER_POSTGRES_PASSWORD:?ORDER_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      PAYMENT_POSTGRES_DB: "${PAYMENT_POSTGRES_DB:?PAYMENT_POSTGRES_DB must be supplied in protected runtime.env}"
      PAYMENT_POSTGRES_USER: "${PAYMENT_POSTGRES_USER:?PAYMENT_POSTGRES_USER must be supplied in protected runtime.env}"
      PAYMENT_POSTGRES_PASSWORD: "${PAYMENT_POSTGRES_PASSWORD:?PAYMENT_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      DELIVERY_POSTGRES_DB: "${DELIVERY_POSTGRES_DB:?DELIVERY_POSTGRES_DB must be supplied in protected runtime.env}"
      DELIVERY_POSTGRES_USER: "${DELIVERY_POSTGRES_USER:?DELIVERY_POSTGRES_USER must be supplied in protected runtime.env}"
      DELIVERY_POSTGRES_PASSWORD: "${DELIVERY_POSTGRES_PASSWORD:?DELIVERY_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      NOTIFICATION_POSTGRES_DB: "${NOTIFICATION_POSTGRES_DB:?NOTIFICATION_POSTGRES_DB must be supplied in protected runtime.env}"
      NOTIFICATION_POSTGRES_USER: "${NOTIFICATION_POSTGRES_USER:?NOTIFICATION_POSTGRES_USER must be supplied in protected runtime.env}"
      NOTIFICATION_POSTGRES_PASSWORD: "${NOTIFICATION_POSTGRES_PASSWORD:?NOTIFICATION_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      OPERATIONS_POSTGRES_DB: "${OPERATIONS_POSTGRES_DB:?OPERATIONS_POSTGRES_DB must be supplied in protected runtime.env}"
      OPERATIONS_POSTGRES_USER: "${OPERATIONS_POSTGRES_USER:?OPERATIONS_POSTGRES_USER must be supplied in protected runtime.env}"
      OPERATIONS_POSTGRES_PASSWORD: "${OPERATIONS_POSTGRES_PASSWORD:?OPERATIONS_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
  caddy:
    <<: *cloud
    image: "${INFRA_IMAGE_CADDY:?approved release infrastructure Caddy registry digest required}"
    ports: !override ["80:80", "443:443"]
    networks: {edge: {ipv4_address: 172.31.250.2}, private: {}}
    mem_limit: 192m
    volumes: [./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config, caddy-logs:/var/log/caddy]
    depends_on: {frontend: {condition: service_healthy}, api-gateway: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/healthz], interval: 20s, timeout: 5s, retries: 5}
    environment: !override
      DOMAIN_NAME: "${DOMAIN_NAME:?DOMAIN_NAME must be supplied in protected runtime.env}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL must be supplied in protected runtime.env}"
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    <<: *cloud
    healthcheck: {test: [CMD, wget, --spider, -q, "http://127.0.0.1:9090/-/healthy"], interval: 20s, timeout: 5s, retries: 10, start_period: 30s}
    ports: !override ["127.0.0.1:9090:9090"]
    mem_limit: 512m
    volumes: !override [./infrastructure/cloud/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./monitoring/prometheus/rules:/etc/prometheus/rules:ro, ./infrastructure/cloud/monitoring/cloud-alerts.yml:/etc/prometheus/cloud-alerts.yml:ro, prometheus-data:/prometheus]
    command: !override [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d, --storage.tsdb.retention.size=2GB]
    environment: !override {}
  grafana:
    image: "${INFRA_IMAGE_GRAFANA:?approved release infrastructure Grafana registry digest required}"
    <<: *cloud
    healthcheck: {test: [CMD, wget, --spider, -q, "http://127.0.0.1:3000/api/health"], interval: 20s, timeout: 5s, retries: 10, start_period: 30s}
    ports: !override ["127.0.0.1:3001:3000"]
    mem_limit: 384m
    volumes: !override [./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro, ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro, grafana-data:/var/lib/grafana]
    environment: !override
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be supplied in protected runtime.env}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be supplied in protected runtime.env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
  node-exporter:
    <<: *cloud
    healthcheck: {test: [CMD, wget, --spider, -q, "http://127.0.0.1:9100/metrics"], interval: 20s, timeout: 5s, retries: 10, start_period: 30s}
    image: "${INFRA_IMAGE_NODE_EXPORTER:?approved release infrastructure node-exporter registry digest required}"
    profiles: [observability]
    ports: []
    pid: host
    read_only: true
    command: [--path.rootfs=/host, --collector.textfile.directory=/textfile]
    volumes: ["/:/host:ro,rslave", "${DATA_ROOT:-/opt/orderflow/data}/node-exporter:/textfile:ro"]
    mem_limit: 64m
    environment: !override {}
  blackbox-exporter:
    <<: *cloud
    healthcheck: {test: [CMD, wget, --spider, -q, "http://127.0.0.1:9115/-/healthy"], interval: 20s, timeout: 5s, retries: 10, start_period: 30s}
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    profiles: [observability]
    ports: []
    command: [--config.file=/etc/blackbox/config.yml]
    volumes: [./infrastructure/cloud/monitoring/blackbox.yml:/etc/blackbox/config.yml:ro]
    mem_limit: 64m
    environment: !override {}

networks:
  private:
    driver: bridge
  edge:
    driver: bridge
    ipam:
      config: [{subnet: 172.31.250.0/24}]

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_ROOT:-/opt/orderflow/data}/postgres"
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_ROOT:-/opt/orderflow/data}/redis"
  kafka-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_ROOT:-/opt/orderflow/data}/kafka"
  caddy-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_ROOT:-/opt/orderflow/data}/caddy/data"
  caddy-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_ROOT:-/opt/orderflow/data}/caddy/config"
  caddy-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_ROOT:-/opt/orderflow/data}/caddy/logs"
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_ROOT:-/opt/orderflow/data}/prometheus"
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_ROOT:-/opt/orderflow/data}/grafana"
