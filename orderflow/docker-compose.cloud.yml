name: orderflow-cloud

# Compose >= 2.24.4: !override replaces maps and !reset clears inherited local ports/builds.
x-cloud: &cloud
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  networks: [private]
  security_opt: [no-new-privileges:true]
  logging: &logs
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  service-registry:
    <<: *cloud
    build: !reset null
    image: "${IMAGE_SERVICE_REGISTRY:?IMAGE_SERVICE_REGISTRY must be supplied in protected runtime.env}"
    ports: !reset []
    profiles: !override []
    mem_limit: 320m
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment: !override
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=15.0 -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      SPRING_PROFILES_ACTIVE: "docker,cloud-demo"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
      APP_JWT_ISSUER: "https://${DOMAIN_NAME:?DOMAIN_NAME is required}"
  api-gateway:
    <<: *cloud
    build: !reset null
    image: "${IMAGE_API_GATEWAY:?IMAGE_API_GATEWAY must be supplied in protected runtime.env}"
    ports: !reset []
    profiles: !override []
    mem_limit: 640m
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks: {edge: {ipv4_address: 172.31.250.3, aliases: [api-gateway-edge]}, private: {}}
    environment: !override
      APP_AUTH_JWK_SET_URI: "http://auth-service:8081/api/auth/.well-known/jwks.json"
      APP_CORS_ALLOWED_ORIGINS: "https://${DOMAIN_NAME}"
      APP_JWT_ISSUER: "https://${DOMAIN_NAME:?DOMAIN_NAME is required}"
      EUREKA_DEFAULT_ZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=15.0 -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied in protected runtime.env}"
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: "docker,cloud-demo"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
      APP_SECURITY_HSTS_ENABLED: "true"
      APP_RATE_LIMIT_ENABLED: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: "none"
      APP_PROXY_TRUSTED_ADDRESS: "172.31.250.2"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES: "172\\.31\\.250\\.2"
  auth-service:
    <<: *cloud
    build: !reset null
    image: "${IMAGE_AUTH_SERVICE:?IMAGE_AUTH_SERVICE must be supplied in protected runtime.env}"
    ports: !reset []
    profiles: !override []
    mem_limit: 640m
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes: !override [{type: bind, source: "${CONFIG_ROOT:-/opt/orderflow/config}/jwt-private.pem", target: /run/secrets/orderflow-jwt-private, read_only: true, bind: {create_host_path: false}}, {type: bind, source: "${CONFIG_ROOT:-/opt/orderflow/config}/jwt-public.pem", target: /run/secrets/orderflow-jwt-public, read_only: true, bind: {create_host_path: false}}]
    depends_on: !override {database-bootstrap: {condition: service_completed_successfully}, redis: {condition: service_healthy}, service-registry: {condition: service_healthy}}
    environment: !override
      APP_AUTH_LOGIN_ATTEMPT_WINDOW: "${APP_AUTH_LOGIN_ATTEMPT_WINDOW:-15m}"
      APP_AUTH_LOGIN_MAX_ATTEMPTS: "${APP_AUTH_LOGIN_MAX_ATTEMPTS:-5}"
      APP_AUTH_REFRESH_COOKIE_NAME: "${APP_AUTH_REFRESH_COOKIE_NAME:-ORDERFLOW_REFRESH}"
      APP_AUTH_REFRESH_COOKIE_SAME_SITE: "${APP_AUTH_REFRESH_COOKIE_SAME_SITE:-Strict}"
      APP_AUTH_REFRESH_COOKIE_SECURE: "true"
      APP_AUTH_REFRESH_TOKEN_TTL: "${APP_AUTH_REFRESH_TOKEN_TTL:-14d}"
      APP_JWT_ALLOW_EPHEMERAL_KEYS: "false"
      APP_JWT_ISSUER: "https://${DOMAIN_NAME:?DOMAIN_NAME is required}"
      APP_JWT_KEY_ID: "${APP_JWT_KEY_ID:?APP_JWT_KEY_ID must be supplied in protected runtime.env}"
      EUREKA_DEFAULT_ZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=15.0 -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      POSTGRES_DB: "${AUTH_POSTGRES_DB:?AUTH_POSTGRES_DB must be supplied in protected runtime.env}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PASSWORD: "${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      POSTGRES_PORT: 5432
      POSTGRES_USER: "${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER must be supplied in protected runtime.env}"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied in protected runtime.env}"
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: "${AUTH_SPRING_PROFILES_ACTIVE:-docker,cloud-demo}"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
      APP_JWT_PRIVATE_KEY_LOCATION: "file:/run/secrets/orderflow-jwt-private"
      APP_JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/orderflow-jwt-public"
      APP_BOOTSTRAP_ADMIN_ENABLED: "false"
      SERVER_FORWARD_HEADERS_STRATEGY: "framework"
      APP_OAUTH2_SUCCESS_REDIRECT_URI: "https://${DOMAIN_NAME}/oauth2/success"
      APP_OAUTH2_FAILURE_REDIRECT_URI: "https://${DOMAIN_NAME}/oauth2/failure"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
  product-service:
    <<: *cloud
    build: !reset null
    image: "${IMAGE_PRODUCT_SERVICE:?IMAGE_PRODUCT_SERVICE must be supplied in protected runtime.env}"
    ports: !reset []
    profiles: !override []
    mem_limit: 640m
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment: !override
      APP_AUTH_JWK_SET_URI: "http://auth-service:8081/api/auth/.well-known/jwks.json"
      APP_CATALOG_CATEGORY_CACHE_TTL: "${APP_CATALOG_CATEGORY_CACHE_TTL:-10m}"
      APP_CATALOG_DEFAULT_CURRENCY: "${APP_CATALOG_DEFAULT_CURRENCY:-USD}"
      APP_CATALOG_MAX_PAGE_SIZE: "${APP_CATALOG_MAX_PAGE_SIZE:-100}"
      APP_CATALOG_PRODUCT_CACHE_TTL: "${APP_CATALOG_PRODUCT_CACHE_TTL:-5m}"
      APP_CATALOG_SEARCH_CACHE_TTL: "${APP_CATALOG_SEARCH_CACHE_TTL:-2m}"
      APP_CATALOG_SUPPORTED_CURRENCIES: "${APP_CATALOG_SUPPORTED_CURRENCIES:-USD,EUR,GBP,INR}"
      APP_JWT_ISSUER: "https://${DOMAIN_NAME:?DOMAIN_NAME is required}"
      EUREKA_DEFAULT_ZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=15.0 -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      PRODUCT_POSTGRES_DB: "${PRODUCT_POSTGRES_DB:?PRODUCT_POSTGRES_DB must be supplied in protected runtime.env}"
      PRODUCT_POSTGRES_HOST: "postgres"
      PRODUCT_POSTGRES_PASSWORD: "${PRODUCT_POSTGRES_PASSWORD:?PRODUCT_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      PRODUCT_POSTGRES_PORT: 5432
      PRODUCT_POSTGRES_USER: "${PRODUCT_POSTGRES_USER:?PRODUCT_POSTGRES_USER must be supplied in protected runtime.env}"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied in protected runtime.env}"
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: "docker,cloud-demo"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  cart-service:
    <<: *cloud
    build: !reset null
    image: "${IMAGE_CART_SERVICE:?IMAGE_CART_SERVICE must be supplied in protected runtime.env}"
    ports: !reset []
    profiles: !override []
    mem_limit: 640m
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment: !override
      APP_AUTH_JWK_SET_URI: "http://auth-service:8081/api/auth/.well-known/jwks.json"
      APP_CART_MAX_DISTINCT_ITEMS: "${APP_CART_MAX_DISTINCT_ITEMS:-100}"
      APP_CART_MAX_QUANTITY_PER_ITEM: "${APP_CART_MAX_QUANTITY_PER_ITEM:-99}"
      APP_CART_TTL: "${APP_CART_TTL:-30d}"
      APP_JWT_ISSUER: "https://${DOMAIN_NAME:?DOMAIN_NAME is required}"
      APP_PRODUCT_CLIENT_BASE_URL: "http://PRODUCT-SERVICE"
      APP_PRODUCT_CLIENT_CONNECT_TIMEOUT: "${APP_PRODUCT_CLIENT_CONNECT_TIMEOUT:-2s}"
      APP_PRODUCT_CLIENT_READ_TIMEOUT: "${APP_PRODUCT_CLIENT_READ_TIMEOUT:-3s}"
      EUREKA_DEFAULT_ZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=15.0 -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied in protected runtime.env}"
      REDIS_PORT: 6379
