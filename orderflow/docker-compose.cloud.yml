      APP_INVENTORY_EXPIRATION_BATCH_SIZE: "${APP_INVENTORY_EXPIRATION_BATCH_SIZE:-50}"
      APP_INVENTORY_EXPIRATION_POLL_DELAY: "${APP_INVENTORY_EXPIRATION_POLL_DELAY:-30s}"
      APP_INVENTORY_RESERVATION_TTL: "${APP_INVENTORY_RESERVATION_TTL:-15m}"
      APP_JWT_ISSUER: "https://${DOMAIN_NAME:?DOMAIN_NAME is required}"
      APP_ORDER_EVENTS_DLT: "${APP_ORDER_EVENTS_DLT:-orderflow.order-events.v1.DLT}"
      APP_ORDER_EVENTS_TOPIC: "${APP_ORDER_EVENTS_TOPIC:-orderflow.order-events.v1}"
      APP_OUTBOX_BATCH_SIZE: "${APP_OUTBOX_BATCH_SIZE:-50}"
      APP_OUTBOX_LOCK_TIMEOUT: "${APP_OUTBOX_LOCK_TIMEOUT:-2m}"
      APP_OUTBOX_MAX_ATTEMPTS: "${APP_OUTBOX_MAX_ATTEMPTS:-10}"
      APP_OUTBOX_POLL_DELAY: "${APP_OUTBOX_POLL_DELAY:-500ms}"
      APP_OUTBOX_RETRY_BASE_DELAY: "${APP_OUTBOX_RETRY_BASE_DELAY:-2s}"
