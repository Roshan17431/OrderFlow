      APP_PRODUCT_CLIENT_BASE_URL: "http://PRODUCT-SERVICE"
      APP_PRODUCT_CLIENT_CONNECT_TIMEOUT: "${APP_PRODUCT_CLIENT_CONNECT_TIMEOUT:-2s}"
      APP_PRODUCT_CLIENT_READ_TIMEOUT: "${APP_PRODUCT_CLIENT_READ_TIMEOUT:-3s}"
      EUREKA_DEFAULT_ZONE: "http://service-registry:8761/eureka/"
      INVENTORY_POSTGRES_DB: "${INVENTORY_POSTGRES_DB:?INVENTORY_POSTGRES_DB must be supplied in protected runtime.env}"
      INVENTORY_POSTGRES_HOST: "postgres"
      INVENTORY_POSTGRES_PASSWORD: "${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD must be supplied in protected runtime.env}"
      INVENTORY_POSTGRES_PORT: 5432
      INVENTORY_POSTGRES_USER: "${INVENTORY_POSTGRES_USER:?INVENTORY_POSTGRES_USER must be supplied in protected runtime.env}"
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=15.0 -XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be supplied in protected runtime.env}"
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: "docker,cloud-demo"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  order-service:
