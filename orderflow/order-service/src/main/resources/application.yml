spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${ORDER_POSTGRES_HOST:localhost}:${ORDER_POSTGRES_PORT:5432}/${ORDER_POSTGRES_DB:orderflow_order}
    username: ${ORDER_POSTGRES_USER:orderflow_order}
    password: ${ORDER_POSTGRES_PASSWORD:orderflow_order_local_password}
    hikari:
      initialization-fail-timeout: 60000
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: order-service-inventory-events-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  jackson:
    use-jackson2-defaults: true
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8085
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,kafka
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        '[@timestamp]': timestamp
        logger_name: logger
        thread_name: thread
      add:
        service: ${spring.application.name}

app:
  scheduler:
    instance-id: ${APP_SCHEDULER_INSTANCE_ID:${HOSTNAME:order-local}}
  order:
    max-page-size: ${APP_ORDER_MAX_PAGE_SIZE:100}
    payment-window: ${APP_ORDER_PAYMENT_WINDOW:10m}
    minimum-payment-window: ${APP_ORDER_MINIMUM_PAYMENT_WINDOW:5s}
  clients:
    cart:
      base-url: ${APP_CART_CLIENT_BASE_URL:http://CART-SERVICE}
      connect-timeout: ${APP_CART_CLIENT_CONNECT_TIMEOUT:2s}
      read-timeout: ${APP_CART_CLIENT_READ_TIMEOUT:3s}
      discovery-enabled: ${APP_CART_CLIENT_DISCOVERY_ENABLED:true}
      max-attempts: 2
      retry-wait: 200ms
  kafka:
    topics:
      order-events: ${APP_ORDER_EVENTS_TOPIC:orderflow.order-events.v1}
      inventory-events: ${APP_INVENTORY_EVENTS_TOPIC:orderflow.inventory-events.v1}
      payment-events: ${APP_PAYMENT_EVENTS_TOPIC:orderflow.payment-events.v1}
      delivery-events: ${APP_DELIVERY_EVENTS_TOPIC:orderflow.delivery-events.v1}
      order-events-dlt: ${APP_ORDER_EVENTS_DLT:orderflow.order-events.v1.DLT}
      inventory-events-dlt: ${APP_INVENTORY_EVENTS_DLT:orderflow.inventory-events.v1.DLT}
      payment-events-dlt: ${APP_PAYMENT_EVENTS_DLT:orderflow.payment-events.v1.DLT}
      delivery-events-dlt: ${APP_DELIVERY_EVENTS_DLT:orderflow.delivery-events.v1.DLT}
  outbox:
    poll-delay: ${APP_OUTBOX_POLL_DELAY:500ms}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${APP_OUTBOX_MAX_ATTEMPTS:10}
    lock-timeout: ${APP_OUTBOX_LOCK_TIMEOUT:2m}
    retry-base-delay: ${APP_OUTBOX_RETRY_BASE_DELAY:2s}
    send-timeout: ${APP_OUTBOX_SEND_TIMEOUT:10s}
  security:
    jwt:
      issuer: ${APP_JWT_ISSUER:https://orderflow.local}
      jwk-set-uri: ${APP_AUTH_JWK_SET_URI:http://localhost:8081/api/auth/.well-known/jwks.json}
