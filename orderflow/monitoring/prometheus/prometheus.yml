global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/orderflow-alerts.yml
scrape_configs:
  - job_name: orderflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8081
          - product-service:8082
          - cart-service:8083
          - inventory-service:8084
          - order-service:8085
          - payment-service:8086
          - delivery-service:8087
          - notification-service:8088
          - operations-service:8089
