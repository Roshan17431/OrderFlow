name: Release
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Reviewed semantic release version
        required: true
        type: string
      platform:
        required: true
        type: choice
        options: [linux/amd64, linux/arm64]
      backward_compatible:
        description: Reviewed migration compatibility
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  immutable-release:
    uses: ./.github/workflows/build-images.yml
    with:
      release_version: ${{ inputs.release_version }}
      platform: ${{ inputs.platform }}
      backward_compatible: ${{ inputs.backward_compatible }}
  handoff:
    needs: immutable-release
    runs-on: ubuntu-latest
    steps:
      - name: Record manual deployment handoff
        env:
          RUN_ID: ${{ github.run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: echo "Release $RELEASE_VERSION built. Manually dispatch Deploy approved cloud demo release using artifact_run_id=$RUN_ID after reviewing the cloud-demo environment approval." >> "$GITHUB_STEP_SUMMARY"
