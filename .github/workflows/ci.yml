name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: orderflow

permissions:
  contents: read

jobs:
  quality:
    name: Build, integration, contracts, and monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: orderflow/**/pom.xml
      - name: Validate Maven wrapper and environment
        run: |
          test -x ./mvnw
          ./mvnw --version
      - name: Validate Compose topologies
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production-like.yml config --quiet
          ./scripts/validate-production-config.sh
      - name: Run complete Maven verification and generate SBOM
        run: ./mvnw -B -ntp clean verify
      - name: Validate monitoring assets
        run: ./scripts/validate-monitoring.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            orderflow/**/target/surefire-reports/**
            orderflow/**/target/failsafe-reports/**
            orderflow/target/sbom/**

  security:
    name: Secrets, redaction, and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: orderflow/**/pom.xml
      - name: Scan committed source for probable secrets
        run: ./scripts/security-scan.sh
      - name: Verify generated logs are redacted
        run: ./scripts/verify-log-redaction.sh
      - name: Run dependency vulnerability scan
        run: ./mvnw -B -ntp -DskipTests verify -Psecurity-scan
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            orderflow/target/dependency-check/**
            orderflow/**/target/surefire-reports/**

  containers:
    name: Container - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service:
          - service-registry
          - api-gateway
          - auth-service
          - product-service
          - cart-service
          - inventory-service
          - order-service
          - payment-service
          - delivery-service
          - notification-service
          - operations-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build hardened runtime image
        uses: docker/build-push-action@v6
        with:
          context: orderflow
          file: orderflow/${{ matrix.service }}/Dockerfile
          push: false
          load: false
          tags: orderflow/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
