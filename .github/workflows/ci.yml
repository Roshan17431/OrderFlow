name: CI

on:
  workflow_call:
    inputs:
      skip-container-builds:
        type: boolean
        default: false
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: orderflow

permissions:
  contents: read

jobs:
  quality:
    name: Build, integration, contracts, and monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: orderflow/**/pom.xml
      - name: Validate Maven wrapper and environment
        run: |
          test -x ./mvnw
          ./mvnw --version
      - name: Validate Compose topologies
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production-like.yml config --quiet
          ./scripts/validate-production-config.sh
      - name: Run complete Maven verification and generate SBOM
        run: ./mvnw -B -ntp clean verify
      - name: Validate monitoring assets
        run: ./scripts/validate-monitoring.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            orderflow/**/target/surefire-reports/**
            orderflow/**/target/failsafe-reports/**
            orderflow/target/sbom/**

  security:
    name: Secrets, redaction, and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: orderflow/**/pom.xml
      - name: Scan committed source for probable secrets
        run: ./scripts/security-scan.sh
      - name: Verify generated logs are redacted
        run: ./scripts/verify-log-redaction.sh
      - name: Run dependency vulnerability scan
        run: ./mvnw -B -ntp -DskipTests verify -Psecurity-scan
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            orderflow/target/dependency-check/**
            orderflow/**/target/surefire-reports/**

  containers:
    if: ${{ !inputs.skip-container-builds }}
    name: Container - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service:
          - service-registry
          - api-gateway
          - auth-service
          - product-service
          - cart-service
          - inventory-service
          - order-service
          - payment-service
          - delivery-service
          - notification-service
          - operations-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build hardened runtime image
        uses: docker/build-push-action@v6
        with:
          context: orderflow
          file: orderflow/${{ matrix.service }}/Dockerfile
          push: false
          load: false
          tags: orderflow/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  frontend:
    name: Frontend quality and fixture browsers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: orderflow/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: orderflow/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend standalone container
        if: ${{ !inputs.skip-container-builds }}
        uses: docker/build-push-action@v6
        with:
          context: orderflow/frontend
          file: orderflow/frontend/Dockerfile
          push: false
          tags: orderflow/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Upload frontend browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            orderflow/frontend/playwright-report/**
            orderflow/frontend/test-results/**

  cloud-configuration:
    name: Cloud configuration and deployment safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'
      - name: Deployment and backup safety contracts
        run: python3 -m unittest discover -s scripts/deploy/tests -v
      - name: Cloud journey safety and actual local TLS transport contracts
        run: |
          command -v openssl >/dev/null
          timeout 180s python3 -m unittest discover -s scripts/cloud/tests -v
      - name: Deployment, backup, cloud and bootstrap shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(rg --files -g '*.sh' -0 scripts infrastructure)
      - name: Cloud runtime policy contracts
        run: python3 -m unittest discover -s infrastructure/cloud/tests -v
      - name: Terraform formatting and provider validation
        working-directory: orderflow/infrastructure/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          timeout 300s terraform test -no-color
      - name: Validate actual Caddy configuration without ACME issuance
        run: |
          timeout 180s docker run --rm --network none --memory 128m \
            -e DOMAIN_NAME=orderflow.example.invalid -e ACME_EMAIL=operator@example.invalid \
            -v "$PWD/infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate cloud Prometheus configuration and alert rules
        run: |
          timeout 180s docker run --rm --network none --memory 128m --entrypoint promtool \
            -v "$PWD/monitoring/prometheus/rules:/etc/prometheus/rules:ro" \
            -v "$PWD/infrastructure/cloud/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/infrastructure/cloud/monitoring/cloud-alerts.yml:/etc/prometheus/cloud-alerts.yml:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Validate workflow expressions and structure
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11 -color
